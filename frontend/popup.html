
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFish</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="fish">🐟</div>
      <div>
        <h1>FocusFish</h1>
        <p class="subtitle">Find your focus. Ride the flow.</p>
      </div>
    </header>

    <section class="session-card">
      <div class="status-row">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Ready to focus?</span>
      </div>

      <p id="timer" class="timer">00:00:00</p>
      <p id="sessionMessage" class="message">
        Your focus journey starts here.
      </p>

      <button id="sessionButton" class="primary-button">
        Start focusing
      </button>
    </section>

    <section class="sites-section">
      <div class="section-heading">
        <h2>Blocked websites</h2>
        <span id="siteCount" class="count">0 sites</span>
      </div>

      <p class="helper-text">
        These sites will be blocked while your session is active.
      </p>

      <form id="addSiteForm" class="add-site-form">
        <input
          id="siteInput"
          type="text"
          placeholder="e.g. youtube.com"
          aria-label="Website domain to block"
          autocomplete="off"
        >
        <button type="submit" class="add-button">Add</button>
      </form>

      <ul id="siteList" class="site-list"></ul>
      <p id="siteMessage" class="site-message" aria-live="polite"></p>
    </section>

    <footer>
      Small steps. Better focus. 🌊
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
